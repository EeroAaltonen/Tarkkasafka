<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Safkatrack</title>
  <meta name="description" content="Turun opiskelijaravintoloiden ruokalistat yhdessä paikassa">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Safkatrack">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Safkatrack</h1>
      <button id="locate" class="chip" type="button" aria-pressed="false">📍 Lähimmät</button>
    </div>
    <nav id="days" class="days" aria-label="Päivä"></nav>
    <div id="filters" class="filters"></div>
  </header>

  <main id="view" aria-live="polite">
    <p class="muted center">Ladataan ruokalistoja…</p>
  </main>

  <footer id="status" class="status muted"></footer>

  <nav class="tabs" aria-label="Näkymä">
    <button data-tab="list" type="button"><span aria-hidden="true">🍽️</span>Ravintolat</button>
    <button data-tab="rank" type="button"><span aria-hidden="true">💪</span>Rankkaus</button>
    <button data-tab="map" type="button"><span aria-hidden="true">🗺️</span>Kartta</button>
    <button data-tab="favs" type="button"><span aria-hidden="true">⭐</span>Suosikit</button>
  </nav>

  <script src="app.js" type="module"></script>
</body>
</html>
